# Shared checkout and artifact environment. Events below state only their workload and resource differences.
.cxlmemsim-source: &cxlmemsim-source
  submodules: false
  lfs: false

.cxlmemsim-component-tools: &cxlmemsim-component-tools
  image: docker.cnb.cool/gevico.online/jensen/cxl-lab@sha256:df9050e0657134935975448d83dbe354b174a13a87e64b2c2991d23cfaa50f15
  volumes:
    - cxlmemsim-build-cache:/cache/cxlmemsim/ccache:copy-on-write

.cxlmemsim-docker-service: &cxlmemsim-docker-service
  - docker

$:
  # Verify that CNB checked out the exact source shape expected by this component.
  api_trigger_source_probe:
    - git: *cxlmemsim-source
      runner:
        cpus: 2
      stages:
        - name: verify CXLMemSim source checkout
          script: |
            bash scripts/verify_source_checkout.sh 4910c7cf2c813698952857f20988ac66dae7fe9d

  # Build, validate, and publish this component as an immutable OCI artifact.
  api_trigger_component_build_publish:
    - git: *cxlmemsim-source
      services: *cxlmemsim-docker-service
      runner:
        cpus: 4
      docker: *cxlmemsim-component-tools
      env:
        CCACHE_DIR: /cache/cxlmemsim/ccache
      stages:
        - name: build test and publish CXLMemSim component
          script: |
           mkdir -p "$PWD/.work/component/outputs"
           bash scripts/build_component.sh \
             --work-dir "$PWD/.work/component/component-build" \
             --cache-dir /cache/cxlmemsim/ccache \
             --payload-dir "$PWD/.work/component/outputs/payload"
           bash scripts/package_component.sh \
             --payload-dir "$PWD/.work/component/outputs/payload" \
             --source-commit "$(git rev-parse HEAD)" \
             --work-dir "$PWD/.work/component/component-package" \
             --manifest-out "$PWD/.work/component/outputs/manifest.json" \
             --archive-out "$PWD/.work/component/outputs/component.tar.zst"
           bash scripts/publish_component.sh \
             --manifest "$PWD/.work/component/outputs/manifest.json" \
             --archive "$PWD/.work/component/outputs/component.tar.zst" \
             --work-dir "$PWD/.work/component/component-publish" \
             --candidate-out "$PWD/.work/component/outputs/candidate.json"
           bash scripts/pull_component.sh \
             --container-runtime docker \
             --work-dir "$PWD/.work/component/component-pull" \
             "$PWD/.work/component/outputs/candidate.json" \
             "$PWD/.work/component/verified"

  # Pull the candidate artifact by digest into an empty directory and verify every file.
  api_trigger_component_fresh_pull:
    - git: *cxlmemsim-source
      services: *cxlmemsim-docker-service
      runner:
        cpus: 2
      docker: *cxlmemsim-component-tools
      stages:
        - name: verify artifact contract and fresh pull CXLMemSim component
          script: |
            python3 -m unittest discover -s tests -p 'test_component_artifact.py'
            bash scripts/pull_component.sh \
              --container-runtime docker \
              --work-dir "$PWD/.work/restored/cxlmemsim-pull" \
              manifests/artifacts/cxlmemsim.candidate.json \
              .work/restored/cxlmemsim

  # Observe the native L40 TOOLS_TLS private export table against the guest shim.
  api_trigger_tools_tls_export_oracle:
    - git: *cxlmemsim-source
      runner:
        tags: cnb:arch:amd64:gpu:L40
      docker: *cxlmemsim-component-tools
      stages:
        - name: inspect L40 CUDA TOOLS TLS export table
          timeout: 15m
          script: |
            bash scripts/run_integrity_export_oracle.sh tools-tls tools_tls_oracle

  # Observe the native L40 RUNTIME_CALLBACK_HOOKS export table against the guest shim.
  api_trigger_runtime_callback_hooks_export_oracle:
    - git: *cxlmemsim-source
      runner:
        tags: cnb:arch:amd64:gpu:L40
      docker: *cxlmemsim-component-tools
      stages:
        - name: inspect L40 CUDA runtime callback hooks export table
          timeout: 15m
          script: |
            bash scripts/run_integrity_export_oracle.sh runtime-callback-hooks runtime_callback_hooks_oracle

  # Discover and capture naturally reached private Driver export-table calls on L40.
  api_trigger_private_export_table_probe:
    - git: *cxlmemsim-source
      runner:
        tags: cnb:arch:amd64:gpu:L40
      docker:
        image: docker.cnb.cool/gevico.online/jensen/cxl-lab@sha256:df9050e0657134935975448d83dbe354b174a13a87e64b2c2991d23cfaa50f15
      stages:
        - name: observe L40 CUDA private export table calls
          timeout: 15m
          script: |
            bash scripts/run_private_export_table_probe.sh
